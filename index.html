<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPU Model Optimization Competition — MOA Workshop @ MICRO 2026</title>
<meta name="description" content="A kernel and model optimization competition on FuriosaAI's RNGD NPU, held at the MOA Workshop at MICRO 2026 in Athens. Details coming soon.">

<meta name="robots" content="noindex">
<meta property="og:title" content="NPU Model Optimization Competition — MOA Workshop @ MICRO 2026">
<meta property="og:description" content="Optimize a multimodal LLM on FuriosaAI's RNGD NPU. Details and registration coming soon.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Crect x='16' y='16' width='32' height='32' rx='6' fill='none' stroke='%2322d3ee' stroke-width='4'/%3E%3Crect x='26' y='26' width='12' height='12' rx='2' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- =====================================================================

     ===================================================================== -->
<script>
  const CONFIG = {
    statusText: "Registration opening soon",   // 예: "Registration opens August 24"
  };
</script>

<style>
  :root{
    --ink:#e2e8f0; --ink-2:#94a3b8; --accent:#22d3ee; --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 24px; color:var(--ink); background:#0b1324;
    background-image:radial-gradient(1100px 620px at 78% -12%,rgba(34,211,238,.20),transparent 62%),
                     linear-gradient(180deg,#0b1324 0%,#0f172a 100%);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(900px 560px at 70% 35%,#000 28%,transparent 76%);
            mask-image:radial-gradient(900px 560px at 70% 35%,#000 28%,transparent 76%);
  }
  @media (max-width:760px){
    body::before{
      -webkit-mask-image:radial-gradient(560px 460px at 50% 45%,#000 24%,transparent 78%);
              mask-image:radial-gradient(560px 460px at 50% 45%,#000 24%,transparent 78%);
    }
  }
  .wrap{position:relative; width:100%; max-width:760px; text-align:center}

  .pill{
    display:inline-flex; align-items:center; gap:9px; border:1px solid var(--line);
    background:rgba(255,255,255,.06); border-radius:999px; padding:7px 16px;
    font-size:.82rem; font-weight:600; letter-spacing:.02em; color:#cbd5e1;
  }
  .pill .dot{
    flex:0 0 auto;
    width:8px;height:8px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 0 rgba(34,211,238,.55); animation:pulse 2.4s ease-out infinite;
  }
  @media (max-width:620px){
    .pill{font-size:.72rem; padding:6px 13px; gap:8px; white-space:nowrap}
  }
  @media (max-width:360px){
    .pill{font-size:.66rem; padding:6px 11px}
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,211,238,.55)}
    70%{box-shadow:0 0 0 9px rgba(34,211,238,0)}
    100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}
  }
  @media (prefers-reduced-motion:reduce){.pill .dot{animation:none}}

  h1{
    font-size:clamp(2rem,5.4vw,3.3rem); font-weight:800; letter-spacing:-.025em;
    line-height:1.12; margin:26px 0 0; color:#fff; text-wrap:balance;
  }
  h1 span{color:var(--accent)}
  .sub{font-size:1.08rem; color:#cbd5e1; margin:18px auto 0; max-width:560px; text-wrap:pretty}
  .status{
    margin-top:34px; font-size:.95rem; font-weight:600; color:var(--accent);
    letter-spacing:.02em;
  }

</style>
</head>
<body>
  <main class="wrap">
    <span class="pill"><span class="dot"></span> MOA Workshop · MICRO 2026 · Athens, Greece</span>

    <h1>NPU Model Optimization<br><span>Competition</span></h1>

    <p class="sub">A competition on optimizing end-to-end inference of a multimodal LLM on FuriosaAI's RNGD NPU, held at the MOA Workshop at MICRO 2026.</p>

    <p class="status" id="status"></p>
  </main>

<script>
  document.getElementById("status").textContent = CONFIG.statusText;
</script>
</body>
</html>
